<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Axon - Sign In</title>
    <link rel="stylesheet" href="user.css">
</head>
<body>
    <div class="A">
        <div class="B">
            <h2 class="C">Sign in</h2>
            <form>
                <div class="G">
                    <input type="text" placeholder="Username or email" required>
                    <span class="icon">👤</span>
                </div>

                <div class="H">
                    <input type="password" placeholder="Password" required>
                    <span class="icon">👁</span>
                </div>

                <div class="I">
                    <label class="checkbox">
                        <input type="checkbox" checked>
                        <span>I am not a robot</span>
                    </label>
                    <a href="#">Forgot password?</a>
                </div>

                <button type="submit" class="submit">Sign in</button>
                <p class="text">
                    New to Axon? <a href="#">Create an account</a> 
                </p>
            </form>
        </div> <!-- تگ بسته div.B -->

        <!-- ستون راست: بنر خوش‌آمدگویی -->
        <div class="C">
            <div class="D">Axon</div>
            <h1 class="E">Welcome <br> <span>back.</span></h1>
            <p class="F">
                Everything in your account is waiting for you.
            </p>
        </div>
    </div> <!-- تگ بسته div.A -->
</body>
</html>
